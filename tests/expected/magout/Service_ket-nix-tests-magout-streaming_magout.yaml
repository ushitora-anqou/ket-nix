apiVersion: "v1"
kind: "Service"
metadata:
  labels:
    app.kubernetes.io/managed-by: "Helmraiser"
  name: "ket-nix-tests-magout-streaming"
  namespace: "magout"
spec:
  ports:
  - name: "streaming"
    port: 4000
    protocol: "TCP"
    targetPort: "streaming"
  selector:
    app.kubernetes.io/component: "streaming"
    app.kubernetes.io/name: "node"
    app.kubernetes.io/part-of: "mastodon"
    magout.anqou.net/mastodon-server: "ket-nix-tests-magout"
  type: "ClusterIP"
