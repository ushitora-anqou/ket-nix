apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  annotations:
    helm.sh/resource-policy: "keep"
  labels:
    app.kubernetes.io/managed-by: "Helmraiser"
  name: "gitea-shared-storage"
  namespace: "forgejo"
spec:
  accessModes:
  - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
  volumeMode: "Filesystem"
